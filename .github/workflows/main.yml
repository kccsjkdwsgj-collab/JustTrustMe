name: Xray Reality with Serveo Tunnel

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. تنزيل Xray
      - name: Install Xray
        run: |
          bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

      # 2. توليد المفاتيح و UUID تلقائياً
      - name: Generate Keys and UUID
        id: keys
        run: |
          UUID=$(xray uuid)
          KEYS=$(xray x25519)
          PRIVATE_KEY=$(echo "$KEYS" | grep "Private key:" | awk '{print $3}')
          PUBLIC_KEY=$(echo "$KEYS" | grep "Public key:" | awk '{print $3}')
          SHORT_ID=$(openssl rand -hex 8)
          
          # حفظ القيم في متغيرات البيئة عشان نستخدمها في الخطوات اللي بعدها
          echo "UUID=$UUID" >> $GITHUB_ENV
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> $GITHUB_ENV
          echo "PUBLIC_KEY=$PUBLIC_KEY" >> $GITHUB_ENV
          echo "SHORT_ID=$SHORT_ID" >> $GITHUB_ENV
          
          echo "=================================================="
          echo "✅ تم توليد بيانات الاتصال بنجاح! (احفظهم عشان هتحتاجهم في Netmod):"
          echo "UUID: $UUID"
          echo "Public Key: $PUBLIC_KEY"
          echo "Short ID: $SHORT_ID"
          echo "SNI: ea.com"
          echo "Flow: xtls-rprx-vision"
          echo "=================================================="

      # 3. وضع إعدادات Xray (VLESS Reality على بورت 10000)
      - name: Setup Xray Config
        run: |
          cat > /usr/local/etc/xray/config.json << EOF
          {
            "inbounds": [{
              "port": 10000,
              "protocol": "vless",
              "settings": {
                "clients": [{"id": "${{ env.UUID }}", "flow": "xtls-rprx-vision"}],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp",
                "security": "reality",
                "realitySettings": {
                  "show": false,
                  "dest": "ea.com:443",
                  "xver": 0,
                  "serverNames": ["ea.com"],
                  "privateKey": "${{ env.PRIVATE_KEY }}",
                  "shortIds": ["${{ env.SHORT_ID }}"]
                }
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF

      # 4. تشغيل Xray في الخلفية
      - name: Start Xray
        run: |
          nohup xray run -c /usr/local/etc/xray/config.json > /dev/null 2>&1 &
          sleep 3

      # 5. تشغيل Serveo Tunnel واستخراج العنوان
      - name: Start Serveo Tunnel
        run: |
          # تشغيل Serveo في الخلفية وربطه ببورت 10000
          ssh -o StrictHostKeyChecking=no -R 0:localhost:10000 serveo.net > serveo.log 2>&1 &
          
          # الانتظار شوية عشان Serveo ياخد بورت ويعطينا العنوان
          echo "⏳ جاري انتظار Serveo عشان يدينا عنوان..."
          sleep 10
          
          echo "=================================================="
          echo "📋 عنوان السيرفر بتاعك (Serveo Address):"
          echo "=================================================="
          # طباعة الـ Logs عشان تشوف العنوان والبورت
          cat serveo.log
          echo "=================================================="
          echo "⚠️ خد العنوان والبورت اللي فوق وحطهم في Netmod"
          echo "=================================================="

      # 6. إبقاء الـ Action شغال
      - name: Keep Alive
        run: |
          while true; do sleep 3600; done
