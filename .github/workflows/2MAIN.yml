name: Run FF Master Key Bot

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: ff-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Utilities (7z & curl)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full curl

      - name: Download & Extract Bot Archive
        env:
          LIDEND_URL: ${{ secrets.LIDEND_URL }}
          SRT_UNLECKED: ${{ secrets.SRT_UNLECKED }}
        run: |
          echo "⬇️ جاري تحميل الملف المضغوط..."
          curl -L -f -s -S "$LIDEND_URL" -o bot_archive.7z
          
          echo "🔓 جاري فك ضغط الملف بكلمة السر..."
          7z x bot_archive.7z -p"$SRT_UNLECKED" -y
          
          rm -f bot_archive.7z

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install blackboxprotobuf --no-deps
          pip install --upgrade "protobuf>=5.26.0"

      - name: Run Master Key Bot
        run: |
          python master_key_bot_ui.py
