name: Xray Reality with Bore Tunnel + WARP (NekoBox Format)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Xray and jq
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
          sudo apt-get install -y jq

      - name: Generate Keys and UUID
        id: keys
        run: |
          UUID=$(xray uuid)
          xray x25519 > /tmp/keys.txt
          PRIVATE_KEY=$(grep -i "private" /tmp/keys.txt | awk '{print $NF}')
          PUBLIC_KEY=$(grep -i "public" /tmp/keys.txt | awk '{print $NF}')
          SHORT_ID=$(openssl rand -hex 8)
          
          echo "UUID=$UUID" >> $GITHUB_ENV
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> $GITHUB_ENV
          echo "PUBLIC_KEY=$PUBLIC_KEY" >> $GITHUB_ENV
          echo "SHORT_ID=$SHORT_ID" >> $GITHUB_ENV

      - name: Setup Xray Config
        run: |
          sudo tee /usr/local/etc/xray/config.json > /dev/null << EOF
          {
            "inbounds": [{
              "port": 10000,
              "protocol": "vless",
              "settings": {
                "clients": [{"id": "${{ env.UUID }}", "flow": "xtls-rprx-vision"}],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp",
                "security": "reality",
                "realitySettings": {
                  "show": false,
                  "dest": "ea.com:443",
                  "xver": 0,
                  "serverNames": ["ea.com"],
                  "privateKey": "${{ env.PRIVATE_KEY }}",
                  "shortIds": ["${{ env.SHORT_ID }}"]
                }
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF

      - name: Start Xray
        run: |
          sudo nohup xray run -c /usr/local/etc/xray/config.json > /dev/null 2>&1 &
          sleep 3

      - name: Start Bore Tunnel
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore
          
          nohup ./bore local 10000 --to bore.pub > bore.log 2>&1 &
          sleep 5
          
          PORT=$(grep -o 'bore.pub:[0-9]*' bore.log | cut -d: -f2)
          echo "PORT=$PORT" >> $GITHUB_ENV
          
          VLESS_LINK="vless://${{ env.UUID }}@bore.pub:$PORT?type=tcp&security=reality&sni=ea.com&fp=chrome&pbk=${{ env.PUBLIC_KEY }}&sid=${{ env.SHORT_ID }}&flow=xtls-rprx-vision&allowInsecure=1#GitHub-Action-Bore"
          echo "VLESS_LINK=$VLESS_LINK" >> $GITHUB_ENV

      # الخطوة دي هي اللي هتولد رابط WARP بالصيغة اللي NekoBox بيفهمها
      - name: Generate WARP Profile for NekoBox
        run: |
          wget https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64 -O wgcf
          chmod +x wgcf
          ./wgcf register --accept-tos
          ./wgcf generate
          
          WG_PRIVATE_KEY=$(grep "PrivateKey" wgcf-profile.conf | cut -d '=' -f2 | tr -d ' ')
          # نأخذ الـ IPv4 بس عشان NekoBox
          WG_ADDRESS=$(grep "Address" wgcf-profile.conf | cut -d '=' -f2 | tr -d ' ' | cut -d ',' -f1)
          WG_PUBLIC_KEY=$(grep "PublicKey" wgcf-profile.conf | cut -d '=' -f2 | tr -d ' ')
          WG_ENDPOINT=$(grep "Endpoint" wgcf-profile.conf | cut -d '=' -f2 | tr -d ' ')
          
          WG_HOST=$(echo $WG_ENDPOINT | cut -d: -f1)
          WG_PORT=$(echo $WG_ENDPOINT | cut -d: -f2)
          
          # بناء الـ JSON المطلوب لـ sing-box (NekoBox)
          JSON_CONFIG=$(jq -n \
            --arg pk "$WG_PRIVATE_KEY" \
            --arg pub "$WG_PUBLIC_KEY" \
            --arg host "$WG_HOST" \
            --arg port "$WG_PORT" \
            --arg addr "$WG_ADDRESS" \
            '{type: "wireguard", tag: "proxy", server: $host, server_port: ($port|tonumber), local_address: [$addr], private_key: $pk, peer_public_key: $pub, mtu: 1280, reserved: [0,0,0]}')
            
          BASE64_CONFIG=$(echo "$JSON_CONFIG" | base64 -w 0)
          WARP_LINK="sn://wg?${BASE64_CONFIG}#Cloudflare-WARP"
          
          echo "WARP_LINK=$WARP_LINK" >> $GITHUB_ENV

      - name: Update Subscription File
        run: |
          # كتابة الرابطين في ملف الاشتراك
          echo "${{ env.VLESS_LINK }}" > sub.txt
          echo "${{ env.WARP_LINK }}" >> sub.txt
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add sub.txt
          git commit -m "Auto-update subscription with WARP (NekoBox format)" || exit 0
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:master

      - name: Keep Alive
        run: |
          while true; do sleep 3600; done
