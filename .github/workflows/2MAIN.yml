name: Run FF Master Key Bot

on:
  push:
    branches: [ main, master ]
  schedule:
  
    - cron: '0 */5 * * *'
  workflow_dispatch: 
concurrency:
  group: ff-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Utilities (7z & curl)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full curl

      - name: Download & Extract Bot Archive
        env:
          ARCHIVE_URL: ${{ secrets.ARCHIVE_URL || secrets.BOT_URL || secrets.URL }}
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD || secrets.BOT_PASSWORD || secrets.PASSWORD }}
        run: |
          echo "⬇️ جاري تحميل الملف المضغوط..."
          curl -L -f -s -S "$LIDEND_URL" -o bot_archive.7z
          
          echo "🔓 جاري فك ضغط الملف بكلمة السر..."
          7z x bot_archive.7z -p"$SRT_UNLECKED" -y
          
          # حذف الملف المضغوط بعد فكه لتوفير المساحة
          rm -f bot_archive.7z

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "⚠️ requirements.txt غير موجود، جاري تثبيت الحزم الأساسية..."
            pip install pyrogram TgCrypto firebase-admin python-dotenv httpx pycryptodome protobuf requests PyJWT aiohttp psutil pytz pymongo motor dnspython
          fi

      - name: Run Master Key Bot
        run: |
          python master_key_bot_ui.py

