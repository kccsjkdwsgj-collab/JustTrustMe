name: Xray Reality with Bore Tunnel (Auto Subscription)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # مهم عشان نقدر نعمل push

      - name: Install Xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

      - name: Generate Keys and UUID
        id: keys
        run: |
          UUID=$(xray uuid)
          xray x25519 > /tmp/keys.txt
          PRIVATE_KEY=$(grep -i "private" /tmp/keys.txt | awk '{print $NF}')
          PUBLIC_KEY=$(grep -i "public" /tmp/keys.txt | awk '{print $NF}')
          SHORT_ID=$(openssl rand -hex 8)
          
          echo "UUID=$UUID" >> $GITHUB_ENV
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> $GITHUB_ENV
          echo "PUBLIC_KEY=$PUBLIC_KEY" >> $GITHUB_ENV
          echo "SHORT_ID=$SHORT_ID" >> $GITHUB_ENV
          
          echo "=================================================="
          echo "✅ تم توليد بيانات الاتصال بنجاح!"
          echo "UUID: $UUID"
          echo "Public Key: $PUBLIC_KEY"
          echo "Short ID: $SHORT_ID"
          echo "=================================================="

      - name: Setup Xray Config
        run: |
          sudo tee /usr/local/etc/xray/config.json > /dev/null << EOF
          {
            "inbounds": [{
              "port": 10000,
              "protocol": "vless",
              "settings": {
                "clients": [{"id": "${{ env.UUID }}", "flow": "xtls-rprx-vision"}],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp",
                "security": "reality",
                "realitySettings": {
                  "show": false,
                  "dest": "ea.com:443",
                  "xver": 0,
                  "serverNames": ["ea.com"],
                  "privateKey": "${{ env.PRIVATE_KEY }}",
                  "shortIds": ["${{ env.SHORT_ID }}"]
                }
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF

      - name: Start Xray
        run: |
          sudo nohup xray run -c /usr/local/etc/xray/config.json > /dev/null 2>&1 &
          sleep 3

      - name: Start Bore Tunnel
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore
          
          nohup ./bore local 10000 --to bore.pub > bore.log 2>&1 &
          sleep 5
          
          PORT=$(grep -o 'bore.pub:[0-9]*' bore.log | cut -d: -f2)
          echo "PORT=$PORT" >> $GITHUB_ENV
          
          VLESS_LINK="vless://${{ env.UUID }}@bore.pub:$PORT?type=tcp&security=reality&sni=ea.com&fp=chrome&pbk=${{ env.PUBLIC_KEY }}&sid=${{ env.SHORT_ID }}&flow=xtls-rprx-vision#GitHub-Action-Bore"
          echo "VLESS_LINK=$VLESS_LINK" >> $GITHUB_ENV
          
          echo "=================================================="
          echo "🔗 الرابط الجاهز: $VLESS_LINK"
          echo "=================================================="

      # الخطوة دي هي اللي بتحدث ملف sub.txt وتعمله push للريبو
      - name: Update and Push Subscription File
        run: |
          echo "${{ env.VLESS_LINK }}" > sub.txt
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add sub.txt
          # لو مفيش تغيير في الملف، الأمر هيكمل عادي
          git commit -m "Auto-update subscription link" || exit 0
          
          # استخدام التوكن عشان نعمل push
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:master

      - name: Keep Alive
        run: |
          while true; do sleep 3600; done
